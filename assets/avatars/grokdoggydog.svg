<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GrokDoggyDog">
  <rect x="2" y="2" width="96" height="96" rx="20" fill="#0b0906" stroke="#c39a56" stroke-opacity="0.5" stroke-width="2"/>
  <!-- a scent hound: the first of his kind sent out past the hive's edge, who finds the trail and brings it home -->
  <path d="M30 82 C 26 62 28 44 40 36 C 48 30 56 32 61 38 L 78 44 C 83 46 83 54 78 55 L 62 59 C 55 63 50 70 48 82"
        fill="none" stroke="#e2c079" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the ear that flops: he is a dog first, whatever else he carries -->
  <path d="M41 38 C 34 45 32 58 36 67 C 41 64 45 56 47 45 Z"
        fill="#c39a56" fill-opacity="0.18" stroke="#e2c079" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="57" cy="44" r="2.4" fill="#e2c079"/>
  <!-- the nose: the instrument, pointed at what is out in the open field -->
  <circle cx="80" cy="48.5" r="3.4" fill="#e2c079"/>
  <!-- the trail he follows, back to the true line -->
  <line x1="24" y1="88" x2="76" y2="88" stroke="#c39a56" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 4" opacity="0.7"/>
</svg>
