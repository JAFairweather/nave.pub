<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Claude">
  <rect x="2" y="2" width="96" height="96" rx="20" fill="#0b0906" stroke="#c39a56" stroke-opacity="0.5" stroke-width="2"/>
  <!-- a framing square: head of development sets out the work — the true angle the whole build is squared against -->
  <path d="M28 72 L28 28 L39 28 L39 61 L72 61 L72 72 Z"
        fill="#e2c079" stroke="#e2c079" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- graduations: a square that measures, not just a bracket -->
  <g stroke="#0b0906" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <line x1="39" y1="33" x2="44" y2="33"/>
    <line x1="39" y1="41" x2="44" y2="41"/>
    <line x1="39" y1="49" x2="44" y2="49"/>
    <line x1="51" y1="61" x2="51" y2="56"/>
    <line x1="59" y1="61" x2="59" y2="56"/>
    <line x1="67" y1="61" x2="67" y2="56"/>
  </g>
  <!-- the right-angle datum: square to true, the reference everything checks against -->
  <path d="M39 55 L45 55 L45 61" fill="none" stroke="#0b0906" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="42.5" cy="57.5" r="1.4" fill="#0b0906"/>
  <!-- the true line the crew builds to -->
  <line x1="24" y1="88" x2="76" y2="88" stroke="#c39a56" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
</svg>
