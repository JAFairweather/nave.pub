name: Quill — install thrice-daily scribe schedule

# Installs (idempotently) the Director's drafting cadence: the bunker-mode
# jaf-scribe runs LIVE at 09:00, 13:00 and 19:00 America/New_York, drafting at
# most 2 candidates per run (MAX_DRAFTS=2 → ≤6 offers/day on the Ngage desk).
# The key stays in Bunker46; the scribe only ever *offers* — nothing publishes
# without the Director's own signature. Re-run any time to refresh the
# schedule; it never touches the luke-brain entry.
on:
  workflow_dispatch:

concurrency:
  group: deploy-nave
  cancel-in-progress: false

jobs:
  install-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Install crontab over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # Drop our managed line AND any stray CRON_TZ (this box's Debian
            # cron IGNORES CRON_TZ — see the brain entry: times must be UTC).
            # 13,17,23 UTC = 09:00/13:00/19:00 EDT; adjust at DST (EST=UTC-5).
            crontab -l 2>/dev/null | grep -vE '# jaf-scribe-schedule|^CRON_TZ=' > /tmp/ct || true
            echo '0 13,17,23 * * * MAX_DRAFTS=2 bash /root/nave.pub/deploy/ops/run-scribe.sh >> /var/log/jaf-scribe.log 2>&1 # jaf-scribe-schedule (9am/1pm/7pm ET)' >> /tmp/ct
            crontab /tmp/ct
            rm -f /tmp/ct
            echo "── installed schedule ──"
            crontab -l
            echo "scribe drafts ≤2 at 13,17,23 UTC (9am/1pm/7pm EDT); log: /var/log/jaf-scribe.log"
