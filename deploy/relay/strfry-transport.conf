##
## transport.nave.pub — strfry config for the NIP-46 transport-only relay
## (nave.pub#130 split). Carries kind 24133 and nothing else; see
## write-policy-transport.py for the gate. Same base template as strfry.conf;
## only db path, port, info, and writePolicy differ.
##

db = "/app/strfry-transport-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0

    # Behind Caddy — trust the forwarded client IP for rate-limiting/logging.
    realIpHeader = "x-forwarded-for"

    info {
        name = "nave transport"
        description = "NIP-46 transport relay for the Nave bunker signer. Accepts kind 24133 from anyone (end-to-end encrypted; rate-limited per author) and nothing else. Reads are NOT authenticated (no NIP-42) — by design here, since every event on this relay is already encrypted at the protocol level."
        pubkey = ""
        contact = ""
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        plugin = "/app/write-policy-transport.py"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = false
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
