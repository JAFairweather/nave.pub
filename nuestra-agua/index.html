<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestra agua de Esterones</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a picture story for neighbours, read on a phone, few words, big letters
   IDEA a health-post wall poster told in six pictures: the drum on a stand, the tank on the hill, the pump, the tank emptying
   PICTURE one moving drawing per step; the water itself is the thing that moves
   COLOUR water blue leads, Guanacaste green hills and earth support, sun yellow marks the step number
   TYPE Atkinson Hyperlegible 700 + 400, large
   LAYOUT one column, phone first: step title, drawing, two or three short sentences, a listen button */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b1420);--ink:light-dark(#14202b,#eef3f8);--mut:light-dark(#4d5b68,#a9b6c2);--line:light-dark(#d5dfe8,#24384c);--blue:#0b57b8;--water:light-dark(#1f7ae0,#3d94f5);--wlt:light-dark(#9fd0ff,#1d5aa0);--sky:light-dark(#dff1ff,#10233d);--h1:light-dark(#8fce78,#2f5f2c);--h2:light-dark(#c7a57a,#4a3a26);--tank:light-dark(#f4f1ea,#39424f);--air:light-dark(#fffaf0,#1a202b);--pump:light-dark(#f47230,#ef7a3c);--roof:light-dark(#b5533a,#c96a4f);--warn:light-dark(#d1281a,#ff8a7d);--sun:#ffc93c;--ok:light-dark(#2f9e4f,#58c878);--card:light-dark(#f3f8fd,#111f30)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
header{background:var(--blue);color:#fff;padding:22px max(5vw,16px) 26px}
.in{max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:clamp(32px,9vw,44px);line-height:1.05;margin:0 0 8px;letter-spacing:-.01em}
header p{margin:0;font-size:20px;color:#e3eeff}
.lang{display:flex;gap:4px;flex:none}
button{font:700 17px "Atkinson Hyperlegible",sans-serif;min-height:48px;padding:0 16px;border-radius:10px;cursor:pointer}
.lang button{border:1px solid #ffffff90;background:transparent;color:#fff;min-width:52px}
.lang button[aria-pressed=true]{background:#fff;color:var(--blue)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
section{padding:28px max(5vw,16px) 8px}
h2{font-size:clamp(24px,6.6vw,30px);line-height:1.12;margin:0 0 12px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-wrap:balance}
h2 i{font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--sun);color:#14202b;display:grid;place-items:center;font-size:24px}
.pic{border-radius:16px;overflow:hidden;background:var(--sky);border:1px solid var(--line)}
.pic svg{display:block;width:100%;height:auto}
svg text{font:700 14px "Atkinson Hyperlegible",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--halo,var(--sky));stroke-width:4px;stroke-linejoin:round}
svg .w{fill:var(--warn)}svg .bl{fill:var(--water)}svg .big{font-size:26px}svg .cap{font-size:15px}
.say p{margin:12px 0 0;max-width:34em}
.say p b{white-space:nowrap}
.listen{margin-top:14px;display:inline-flex;align-items:center;gap:10px;border:2px solid var(--water);background:transparent;color:var(--ink)}
.listen svg{width:24px;height:24px;flex:none}
.listen[aria-pressed=true]{background:var(--water);color:#fff}
.do{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.do li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px}
.do svg{width:52px;height:52px}
h3{font-size:22px;margin:22px 0 0}
footer{padding:24px max(5vw,16px) 40px;color:var(--mut);font-size:15px}
</style>
</head>

<header><div class="in">
 <div class="top"><h1 data-t="h1"></h1><div class="lang" role="group" aria-label="Idioma"><button id="es" aria-pressed="true">ES</button><button id="en" aria-pressed="false">EN</button></div></div>
 <p data-t="sub"></p>
</div></header>
<main id="main"></main>
<footer><div class="in" data-t="foot"></div></footer>
